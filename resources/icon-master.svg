<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" fill="#2563EB"/>
  <!-- iOS rounds the corners itself and has no adaptive-mask safe zone like
       Android, so this can sit a bit larger/closer to the edge than the
       foreground layer used for the Android adaptive icon. The mark's own
       bounding box (path + counter-hole + accent dot) is centered at
       roughly (55.5, 52.5), not (50, 50), so we re-center around its real
       midpoint before scaling instead of the canvas midpoint. -->
  <g transform="translate(50 50) scale(1.15) translate(-55.5 -52.5)">
    <path d="M35 25H58C67.9411 25 76 33.0589 76 43C76 52.9411 67.9411 61 58 61H47V75H35V25Z" fill="white"/>
    <circle cx="58" cy="43" r="10" fill="#1E293B"/>
    <circle cx="47" cy="75" r="5" fill="#93C5FD"/>
  </g>
</svg>
