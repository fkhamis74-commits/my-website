  <!-- Scaled down and centered on the mark's own bounding-box midpoint
       (~55.5, 52.5 — not the canvas center) so it sits inside Android's
       adaptive-icon safe zone (launchers mask the foreground layer with a
       circle/squircle and would otherwise clip the wide parts of the "P"). -->
